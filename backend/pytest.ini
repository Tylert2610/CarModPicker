[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Coverage is measured but not gated here, and parallelism is not configured
# here either. Both used to be, and both had to move when backend CI split
# pytest into one job per domain.
#
# `--cov-fail-under=51` was a whole suite floor. A domain job runs only its own
# domain's tests against the whole of `app`, so it sees the coverage one ninth
# of the suite produces, which is nowhere near 51 percent and never will be. The
# threshold would have failed all nine jobs while telling us nothing: the number
# it compared against was never a property of the tests being run. There is no
# per job threshold that is both meaningful and safe, because the right floor
# for a domain job depends on how much of `app` that domain owns. The jobs
# instead upload their coverage XML as artifacts, and the shared job prints a
# summary to the run page. Restoring a real gate means combining the nine
# reports first, which is a separate change.
#
# `-n auto` and `--dist=loadfile` left for the same reason in the other
# direction: the reusable workflow supplies `-n` itself from its
# `pytest-workers` input, and having it in both places means the flag is passed
# twice. `--dist=loadfile` still matters and is passed through the workflow's
# `pytest-args` instead of being dropped. It keeps every test in one file on one
# worker, which is what five module scoped fixtures in this suite depend on,
# including the fresh interpreter isolation checks in `tests/entrypoints`. With
# the default `--dist=load` those fixtures get rebuilt on each worker that draws
# a test from the file, which is slower and, for the isolation checks, no longer
# measures what it claims to.
#
# A local `pytest` run still collects the whole suite with coverage, just
# without the failing threshold and single threaded unless `-n` is given.
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    # Suppress ResourceWarnings about unclosed database connections
    -W ignore::ResourceWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
