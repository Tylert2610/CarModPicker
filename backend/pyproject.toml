[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
known_first_party = ["app"]
known_third_party = ["fastapi", "boto3", "pydantic", "pytest"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = [
    "venv/.*",
    "__pycache__/.*",
    "\\.pytest_cache/.*",
    "\\.mypy_cache/.*",
    "../scripts/.*"
]

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "pytest.*",
    "httpx.*",
    "bcrypt.*",
    "jose.*"
]
ignore_missing_imports = true

[tool.bandit]

exclude_dirs = [
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
]

skips = ["B404", "B603", "B607"]

[tool.webbpulse.ci]
