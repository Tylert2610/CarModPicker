name: Frontend CI

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  # Install, format check, lint, test with coverage, and build, via the org
  # reusable workflow. It owns the CodeArtifact login the @webbpulse/* packages
  # need, which is why this job assumes a role and the checks below do not.
  #
  # type-check is not passed separately: `npm run build` runs `tsc -b` before
  # vite, so a type error fails the build step. Passing both would typecheck the
  # project twice per run.
  test-frontend:
    permissions:
      id-token: write
      contents: read
    uses: WebbPulse/.github/.github/workflows/typescript-ci.yml@v1
    with:
      node-version: "22"
      working-directory: frontend
      lint-command: npm run lint
      format-check-command: npm run format:check
      typecheck-command: ""
      test-command: npm run test:run -- --coverage
      build-command: npm run build
      codeartifact-domain: webbpulse
      codeartifact-repository: npm
      aws-region: us-west-2
    secrets:
      role-to-assume: ${{ vars.CI_AWS_ROLE_ARN }}
      codeartifact-domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}

  # The two checks the reusable workflow has no input for. Kept in this repo
  # rather than dropped: the audit gate and the circular-import gate both
  # predate the shared workflow and neither has an equivalent there.
  #
  # Neither needs node_modules from the private registry: `npm audit` reads the
  # lockfile, and madge parses TypeScript source. So this job skips the
  # CodeArtifact login entirely and installs nothing, which is also why it needs
  # no AWS role.
  audit-and-imports:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Audit dependencies for vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Check circular imports
        working-directory: frontend
        run: npx --yes madge --circular --extensions ts,tsx src/
